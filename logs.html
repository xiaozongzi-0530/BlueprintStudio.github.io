<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>已停用 · BlueprintStudio</title>
<style>
  :root { --bg:#0a1128; --panel:rgba(40,72,168,.12); --line:rgba(40,72,168,.25); --accent2:#22d3ee; --text:#e6ebf5; --muted:#8a93a8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; padding:1.5rem; }
  .box { max-width:520px; background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:2.4rem 2rem; text-align:center; }
  .ico { font-size:2.6rem; margin-bottom:1rem; }
  h1 { font-size:1.4rem; margin-bottom:.8rem; }
  h1 em { font-style:normal; color:var(--accent2); }
  p { color:var(--muted); font-size:.92rem; line-height:2; margin-bottom:1.6rem; }
  a { display:inline-block; padding:.65rem 1.6rem; border-radius:10px; text-decoration:none; font-size:.9rem;
    color:var(--accent2); border:1px solid rgba(34,211,238,.4); background:rgba(34,211,238,.08); }
  a:hover { background:rgba(34,211,238,.18); }
  .tip { font-size:.78rem; margin-top:1.2rem; }
</style>
</head>
<body>
  <div class="box">
    <div class="ico">🚧</div>
    <h1>错误日志页已<em>停用</em></h1>
    <p>
      所有管理功能（账号管理、Token 兑换码、额度流水、额度分发、违规申诉、内容举报）<br>
      已统一迁移到<b style="color:var(--accent2);">首页「管理」面板</b>。<br>
      请回首页登录管理员账号后，点击右上角「管理」进入。
    </p>
    <a href="index.html">返回首页 · 打开管理面板</a>
    <p class="tip">本页将在 5 秒后自动跳转…</p>
  </div>
<script>
  setTimeout(function () { location.replace("index.html"); }, 5000);
</script>
</body>
</html>
