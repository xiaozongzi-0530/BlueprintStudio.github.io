<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueprintStudio · 蓝图工作室</title>
<style>
  :root {
    --bg: #0b1020;
    --accent: #4f7cff;
    --accent2: #22d3ee;
    --text: #e6ebf5;
    --muted: #8a93a8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    overflow: hidden;
  }
  /* 蓝图网格背景 */
  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(79,124,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,124,255,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: drift 20s linear infinite;
  }
  @keyframes drift { to { background-position: 40px 40px; } }
  .glow {
    position: fixed; width: 60vw; height: 60vw; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,124,255,.18), transparent 60%);
    top: -20vw; right: -20vw; pointer-events: none;
  }
  main {
    position: relative;
    text-align: center;
    padding: 2rem;
    max-width: 640px;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: .05em;
  }
  h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .badge {
    display: inline-flex; align-items: center; gap: .5rem;
    margin: 1.2rem 0 .6rem;
    padding: .4rem 1rem;
    border: 1px solid rgba(79,124,255,.4);
    border-radius: 999px;
    color: var(--accent2);
    font-size: .9rem;
    background: rgba(79,124,255,.08);
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent2);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .2; } }
  p.desc { color: var(--muted); line-height: 1.8; font-size: 1rem; }
  .progress {
    margin: 2rem auto 1rem;
    max-width: 360px;
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .progress .bar {
    height: 100%; width: 60%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    animation: load 2.4s ease-in-out infinite alternate;
  }
  @keyframes load { from { width: 35%; } to { width: 72%; } }
  .percent { color: var(--muted); font-size: .85rem; letter-spacing: .1em; }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .85rem; }
  .leader {
    margin-top: 1.6rem;
    color: var(--muted);
    font-size: .95rem;
  }
  .leader a { color: var(--accent2); text-decoration: none; }
  .leader a:hover { text-decoration: underline; }
  .actions { margin-top: 1.4rem; }
  .btn {
    display: inline-block;
    text-decoration: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    padding: .6rem 1.6rem;
    border-radius: 10px;
    font-size: .95rem;
    font-weight: 600;
    transition: opacity .2s, transform .2s;
  }
  .btn:hover { opacity: .85; transform: translateY(-2px); }
  .whip {
    margin-top: 2rem;
  }
  .whip-btn {
    display: inline-block;
    border: 1px solid rgba(79,124,255,.5);
    background: rgba(79,124,255,.08);
    color: var(--accent2);
    font-size: 1rem;
    font-weight: 600;
    padding: .8rem 1.8rem;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .1s, box-shadow .2s;
    user-select: none;
  }
  .whip-btn:hover { box-shadow: 0 4px 24px rgba(79,124,255,.35); }
  .whip-btn:active { transform: scale(.92); }
  .whip-btn:disabled { opacity: .6; cursor: not-allowed; }
  .whip-count {
    margin-top: .8rem;
    color: var(--muted);
    font-size: .95rem;
  }
  .whip-count strong { color: var(--accent2); font-size: 1.3rem; }
  .whip-tip { margin-top: .4rem; color: var(--muted); font-size: .8rem; }
  /* 登录区 */
  .auth-area {
    position: fixed; top: 1.2rem; right: 1.4rem; z-index: 10;
    display: flex; align-items: center; gap: .6rem;
  }
  .auth-btn {
    border: 1px solid rgba(79,124,255,.5);
    background: rgba(79,124,255,.08);
    color: var(--accent2);
    font-size: .85rem;
    padding: .45rem 1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: box-shadow .2s, opacity .2s;
  }
  .auth-btn:hover { box-shadow: 0 4px 20px rgba(79,124,255,.3); }
  .user-chip {
    display: flex; align-items: center; gap: .5rem;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    padding: .3rem .9rem .3rem .35rem;
    font-size: .85rem;
  }
  .user-chip img { width: 26px; height: 26px; border-radius: 50%; }
  .user-chip a { color: var(--text); text-decoration: none; }
  .user-chip .logout { color: var(--muted); cursor: pointer; font-size: .8rem; }
  .badge-admin {
    background: #f5b301; color: #1a1a1a;
    font-size: .68rem; font-weight: 700;
    padding: .15rem .5rem; border-radius: 999px;
  }
  .user-chip .logout:hover { color: var(--accent2); }
  /* 登录弹窗 */
  .modal-mask {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #141a30;
    border: 1px solid rgba(79,124,255,.35);
    border-radius: 16px;
    padding: 2rem;
    max-width: 380px; width: 90%;
    text-align: center;
  }
  .modal h3 { margin-bottom: 1rem; }
  .modal .code {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 1.5rem;
    letter-spacing: .2em;
    color: var(--accent2);
    background: rgba(79,124,255,.1);
    border-radius: 10px;
    padding: .8rem;
    margin-bottom: 1rem;
    user-select: all;
  }
  .modal p { color: var(--muted); font-size: .9rem; line-height: 1.7; }
  .modal a { color: var(--accent2); }
  .modal .close {
    margin-top: 1.2rem; cursor: pointer;
    color: var(--muted); font-size: .85rem;
    background: none; border: none;
  }
  .modal .close:hover { color: var(--text); }
  .auth-input {
    width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(79,124,255,.3);
    border-radius: 10px;
    color: var(--text);
    padding: .7rem .9rem;
    font-size: .95rem;
    margin-bottom: .8rem;
    outline: none;
  }
  .auth-input:focus { border-color: var(--accent2); }
  #authStatus { color: var(--muted); font-size: .85rem; }
  #authStatus.err { color: #ff6b6b; }
  #authStatus.ok { color: var(--accent2); }
  .auth-btns { display: flex; gap: .8rem; justify-content: center; }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="auth-area">
    <button class="auth-btn" id="ghBtn">GitHub 登录</button>
    <button class="auth-btn" id="adminBtn" style="display:none;">管理</button>
    <button class="auth-btn" id="loginBtn" style="display:none;">登录 / 注册</button>
    <div class="user-chip" id="userChip" style="display:none;">
      <img id="userAvatar" src="" alt="">
      <span class="badge-admin" id="adminBadge" style="display:none;">官方管理员</span>
      <a id="userName" href="#" target="_blank" rel="noopener"></a>
      <span class="logout" id="deleteBtn">注销账号</span>
      <span class="logout" id="logoutBtn">退出</span>
    </div>
  </div>
  <div class="modal-mask" id="adminModal">
    <div class="modal" style="max-width:520px; text-align:left;">
      <h3 style="text-align:center;">🛠 账号管理</h3>
      <div id="adminList" style="max-height:260px; overflow:auto; font-size:.85rem; line-height:2;"></div>
      <hr style="border:none; border-top:1px solid rgba(255,255,255,.12); margin:1rem 0;">
      <h3 style="font-size:1rem; text-align:center;">分发新账号</h3>
      <input class="auth-input" id="admEmail" type="email" placeholder="邮箱（ID）">
      <input class="auth-input" id="admPass" type="password" placeholder="初始密码（至少6位）">
      <input class="auth-input" id="admNick" type="text" placeholder="昵称">
      <input class="auth-input" id="admUID" type="text" placeholder="UID（8位数字，留空自动生成）" maxlength="8">
      <p id="admStatus" style="color:var(--muted); font-size:.85rem; min-height:1.2em;"></p>
      <div class="auth-btns"><button class="auth-btn" id="admCreate">创建账号</button></div>
      <button class="close" id="admClose" style="display:block; margin:1rem auto 0;">关闭</button>
    </div>
  </div>
  <div class="modal-mask" id="authModal">
    <div class="modal">
      <h3>🔐 账号注册 / 登录</h3>
      <input class="auth-input" id="nickInput" type="text" placeholder="昵称（注册后可修改）" maxlength="20">
      <input class="auth-input" id="emailInput" type="email" placeholder="邮箱" autocomplete="email">
      <input class="auth-input" id="passInput" type="password" placeholder="密码（至少6位）" autocomplete="current-password">
      <p id="authStatus" style="min-height:1.2em;"></p>
      <div class="auth-btns">
        <button class="auth-btn" id="registerBtn">注 册</button>
        <button class="auth-btn" id="doLoginBtn">登 录</button>
      </div>
      <button class="close" id="modalClose">取消</button>
    </div>
  </div>
  <main>
    <h1><span>BlueprintStudio</span> · 蓝图工作室</h1>
    <div class="badge"><span class="dot"></span>网站正在开发中</div>
    <p class="desc">我们正在精心绘制属于你的蓝图，<br>一个更好的站点即将上线，敬请期待。</p>
    <div class="progress"><div class="bar"></div></div>
    <div class="percent">CONSTRUCTING…</div>
    <p class="leader">工作室室长：小粽子（GitHub: <a href="https://github.com/xiaozongzi-0530" target="_blank" rel="noopener">xiaozongzi-0530</a>）</p>
    <div class="actions"><a class="btn" href="join.html">加入我们 →</a></div>
    <div class="whip">
      <button class="whip-btn" id="whipBtn">鞭策开发者，催他干活！</button>
      <div class="whip-count">开发者已被鞭策 <strong id="whipCount">…</strong> 次</div>
      <div class="whip-tip">可以连点，但手速太快会被限流哦～</div>
    </div>
    <footer>© 2026 BlueprintStudio · 保留所有权利</footer>
  </main>
  <script>
    (function () {
      var NS = "blueprintstudio", KEY = "whip";
      var HIT = "https://abacus.jasoncameron.dev/hit/" + NS + "/" + KEY;
      var countEl = document.getElementById("whipCount");
      var btn = document.getElementById("whipBtn");
      var base = 0, localDelta = 0, queue = 0, sending = false;
      function render() { countEl.textContent = base + localDelta; }
      function fetchTotal() {
        fetch("https://abacus.jasoncameron.dev/get/" + NS + "/" + KEY)
          .then(function (r) { return r.text(); })
          .then(function (t) {
            var n = parseInt(t, 10);
            if (!isNaN(n)) { base = n; localDelta = 0; render(); }
          }).catch(function () {});
      }
      function flush() {
        if (sending || queue <= 0) return;
        sending = true;
        var batch = Math.min(queue, 5);
        queue -= batch;
        var chain = Promise.resolve();
        for (var i = 0; i < batch; i++) {
          chain = chain.then(function () {
            return fetch(HIT).catch(function () {});
          });
        }
        chain.then(function () {
          sending = false;
          if (queue > 0) setTimeout(flush, 1000);
        });
      }
      btn.addEventListener("click", function () {
        localDelta++;
        render();
        if (window.bsSaveWhip) window.bsSaveWhip();
        btn.disabled = true;
        setTimeout(function () { btn.disabled = false; }, 700); /* 节流：最快0.7秒一次 */
        queue++;
        setTimeout(flush, 300);
      });
      fetchTotal();
      setInterval(fetchTotal, 30000); /* 每30秒同步一次全站总数 */
    })();
  </script>
  <script>
    /* ===== 账号系统：注册/登录/管理员/封禁/注销 ===== */
    (function () {
      var DB = "https://textdb.dev/api/data/blueprintstudio-users-2026";
      var KEY = "bs_auth";
      var ADMIN_EMAIL = "zhouxinyuan@qq.com";
      var ADMIN_UID = "00000000";
      var BAN_PAGE = "ban.html?email=";
      var loginBtn = document.getElementById("loginBtn");
      var chip = document.getElementById("userChip");
      var nameLink = document.getElementById("userName");
      var adminBadge = document.getElementById("adminBadge");
      var adminBtn = document.getElementById("adminBtn");
      var logoutBtn = document.getElementById("logoutBtn");
      var deleteBtn = document.getElementById("deleteBtn");
      var mask = document.getElementById("authModal");
      var adminMask = document.getElementById("adminModal");
      var emailIn = document.getElementById("emailInput");
      var nickIn = document.getElementById("nickInput");
      var passIn = document.getElementById("passInput");
      var statusEl = document.getElementById("authStatus");
      var me = null, myInfo = {};

      function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = cls || ""; }
      function isAdmin() { return me === ADMIN_EMAIL; }
      function getDB() {
        return fetch(DB + "?t=" + Date.now()).then(function (r) { return r.json(); })
          .catch(function () { return { users: {} }; });
      }
      function saveDB(db) {
        return fetch(DB, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(db) });
      }
      function genUID(db) {
        var used = Object.keys((db && db.users) || {}).map(function (k) { return db.users[k].uid; });
        var uid;
        do { uid = String(Math.floor(10000000 + Math.random() * 90000000)); } while (used.indexOf(uid) !== -1);
        return uid;
      }
      function hash(email, pass) {
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode("bs-salt::" + email + "::" + pass))
          .then(function (b) {
            return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
          });
      }
      function showLogged(info) {
        me = info.email; myInfo = info;
        nameLink.textContent = info.nick || info.email.split("@")[0];
        nameLink.title = info.uid ? ("UID: " + info.uid) : "";
        var admin = isAdmin();
        adminBadge.style.display = admin ? "inline-block" : "none";
        adminBtn.style.display = admin ? "inline-block" : "none";
        loginBtn.style.display = "none";
        chip.style.display = "flex";
      }
      function showLogin() { me = null; loginBtn.style.display = "inline-block"; chip.style.display = "none"; }
      function valid(email, pass) {
        return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) && pass.length >= 6;
      }
      /* 封禁检查：被封禁的账号强制跳转封禁页 */
      function enforceBan() {
        if (!me) return Promise.resolve();
        return getDB().then(function (db) {
          var u = db.users && db.users[me];
          if (u && u.banned) {
            localStorage.removeItem(KEY);
            location.href = BAN_PAGE + encodeURIComponent(me);
            return true;
          }
          return false;
        });
      }
      window.bsSaveWhip = function () {
        if (!me) return;
        getDB().then(function (db) {
          if (db.users && db.users[me]) {
            db.users[me].whips = (db.users[me].whips || 0) + 1;
            saveDB(db);
          }
        });
      };
      function tryAuth(mode) {
        var email = emailIn.value.trim().toLowerCase();
        var pass = passIn.value;
        var nick = (nickIn.value || "").trim().slice(0, 20);
        if (mode === "register" && !nick) { setStatus("请填写昵称", "err"); return; }
        if (!valid(email, pass)) { setStatus("邮箱格式不正确，或密码少于6位", "err"); return; }
        setStatus(mode === "register" ? "注册中…" : "登录中…");
        hash(email, pass).then(function (h) {
          return getDB().then(function (db) {
            db.users = db.users || {};
            var u = db.users[email];
            if (mode === "register") {
              if (u) { setStatus("该邮箱已注册，请直接登录", "err"); return; }
              var rec;
              if (email === ADMIN_EMAIL) {
                rec = { id: email, hash: h, nick: "小粽子", uid: ADMIN_UID, role: "admin", whips: 0, joined: new Date().toISOString() };
              } else {
                rec = { id: email, hash: h, nick: nick, uid: genUID(db), whips: 0, joined: new Date().toISOString() };
              }
              db.users[email] = rec;
              return saveDB(db).then(function () {
                localStorage.setItem(KEY, JSON.stringify({ email: email, hash: h }));
                showLogged({ email: email, nick: rec.nick, uid: rec.uid });
                mask.classList.remove("show");
                setStatus("", "");
              });
            } else {
              if (!u) { setStatus("该邮箱未注册", "err"); return; }
              if (u.hash !== h) { setStatus("密码错误", "err"); return; }
              if (u.banned) { location.href = BAN_PAGE + encodeURIComponent(email); return; }
              localStorage.setItem(KEY, JSON.stringify({ email: email, hash: h }));
              showLogged({ email: email, nick: u.nick, uid: u.uid });
              mask.classList.remove("show");
              setStatus("", "");
            }
          });
        }).catch(function () { setStatus("网络异常，请稍后再试", "err"); });
      }
      function logout() { localStorage.removeItem(KEY); showLogin(); }
      /* 注销账号：输入密码确认后从云端彻底删除 */
      deleteBtn.addEventListener("click", function () {
        var pass = prompt("⚠️ 注销后账号数据将永久删除且无法恢复！\n请输入密码确认：");
        if (pass === null) return;
        hash(me, pass).then(function (h) {
          return getDB().then(function (db) {
            var u = db.users && db.users[me];
            if (!u || u.hash !== h) { alert("密码错误，注销失败"); return; }
            delete db.users[me];
            return saveDB(db).then(function () {
              alert("账号已注销");
              logout();
            });
          });
        });
      });
      /* ===== 管理员面板 ===== */
      function renderAdmin() {
        getDB().then(function (db) {
          var box = document.getElementById("adminList");
          var rows = Object.keys(db.users || {}).map(function (email) {
            var u = db.users[email];
            var banTxt = u.banned ? "解封" : "封禁";
            return "<div>💬 <b>" + (u.nick || "-") + "</b>（UID: " + (u.uid || "-") + "）"
              + " <span style=\"color:var(--muted);\">" + email + "</span>"
              + (u.banned ? " <span style=\"color:#ff6b6b;\">[已封禁]</span>" : "")
              + " <a href=\"javascript:void(0)\" data-act=\"ban\" data-e=\"" + email + "\" style=\"color:var(--accent2); margin-left:.5rem;\">" + banTxt + "</a>"
              + " <a href=\"javascript:void(0)\" data-act=\"del\" data-e=\"" + email + "\" style=\"color:#ff6b6b; margin-left:.4rem;\">删除</a>"
              + " <a href=\"javascript:void(0)\" data-act=\"uid\" data-e=\"" + email + "\" style=\"color:var(--muted); margin-left:.4rem;\">设UID</a>"
              + "</div>";
          });
          box.innerHTML = rows.join("") || "<p style=\"color:var(--muted);\">暂无账号</p>";
        });
      }
      document.getElementById("adminList").addEventListener("click", function (e) {
        var t = e.target.getAttribute("data-act") ? e.target : null;
        if (!t) return;
        var act = t.getAttribute("data-act"), email = t.getAttribute("data-e");
        getDB().then(function (db) {
          var u = db.users && db.users[email];
          if (!u) { alert("账号不存在"); return; }
          if (act === "ban") {
            if (email === ADMIN_EMAIL) { alert("不能封禁管理员"); return; }
            u.banned = !u.banned;
          } else if (act === "del") {
            if (email === ADMIN_EMAIL) { alert("不能删除管理员"); return; }
            if (!confirm("确定永久删除账号 " + email + " ？")) return;
            delete db.users[email];
          } else if (act === "uid") {
            var v = prompt("设置新 UID（8位数字）：", u.uid || "");
            if (v === null) return;
            if (!/^\d{8}$/.test(v)) { alert("UID 必须是8位数字"); return; }
            u.uid = v;
          }
          return saveDB(db).then(renderAdmin);
        });
      });
      document.getElementById("admCreate").addEventListener("click", function () {
        var st = document.getElementById("admStatus");
        var email = document.getElementById("admEmail").value.trim().toLowerCase();
        var pass = document.getElementById("admPass").value;
        var nick = document.getElementById("admNick").value.trim().slice(0, 20);
        var uid = document.getElementById("admUID").value.trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { st.textContent = "邮箱格式不正确"; return; }
        if (pass.length < 6) { st.textContent = "密码至少6位"; return; }
        if (!nick) { st.textContent = "请填写昵称"; return; }
        if (uid && !/^\d{8}$/.test(uid)) { st.textContent = "UID 必须是8位数字"; return; }
        hash(email, pass).then(function (h) {
          return getDB().then(function (db) {
            db.users = db.users || {};
            if (db.users[email]) { st.textContent = "该邮箱已存在"; return; }
            if (uid) {
              var dup = Object.keys(db.users).some(function (k) { return db.users[k].uid === uid; });
              if (dup) { st.textContent = "UID 已被占用"; return; }
            }
            db.users[email] = { id: email, hash: h, nick: nick, uid: uid || genUID(db), whips: 0, joined: new Date().toISOString() };
            return saveDB(db).then(function () {
              st.textContent = "✅ 账号已创建：" + email;
              document.getElementById("admEmail").value = "";
              document.getElementById("admPass").value = "";
              document.getElementById("admNick").value = "";
              document.getElementById("admUID").value = "";
              renderAdmin();
            });
          });
        });
      });
      adminBtn.addEventListener("click", function () { renderAdmin(); adminMask.classList.add("show"); });
      document.getElementById("admClose").addEventListener("click", function () { adminMask.classList.remove("show"); });

      document.getElementById("registerBtn").addEventListener("click", function () { tryAuth("register"); });
      document.getElementById("doLoginBtn").addEventListener("click", function () { tryAuth("login"); });
      loginBtn.addEventListener("click", function () { mask.classList.add("show"); emailIn.focus(); });
      document.getElementById("modalClose").addEventListener("click", function () { mask.classList.remove("show"); });
      logoutBtn.addEventListener("click", logout);
      setInterval(enforceBan, 30000); /* 每30秒检查一次封禁状态 */
      (function init() {
        try {
          var s = JSON.parse(localStorage.getItem(KEY) || "null");
          if (s && s.email) {
            showLogged({ email: s.email });
            getDB().then(function (db) {
              var u = db.users && db.users[s.email];
              if (!u) { logout(); return; }
              if (u.banned) { location.href = BAN_PAGE + encodeURIComponent(s.email); return; }
              showLogged({ email: s.email, nick: u.nick, uid: u.uid });
            });
          } else showLogin();
        } catch (e) { showLogin(); }
      })();
    })();
  </script>
</body>
</html>
