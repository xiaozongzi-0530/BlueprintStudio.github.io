<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueprintStudio · 蓝图工作室</title>
<style>
  :root {
    --bg: #0b1020;
    --accent: #4f7cff;
    --accent2: #22d3ee;
    --text: #e6ebf5;
    --muted: #8a93a8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    overflow: hidden;
  }
  /* 蓝图网格背景 */
  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(79,124,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,124,255,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: drift 20s linear infinite;
  }
  @keyframes drift { to { background-position: 40px 40px; } }
  .glow {
    position: fixed; width: 60vw; height: 60vw; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,124,255,.18), transparent 60%);
    top: -20vw; right: -20vw; pointer-events: none;
  }
  main {
    position: relative;
    text-align: center;
    padding: 2rem;
    max-width: 640px;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: .05em;
  }
  h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .badge {
    display: inline-flex; align-items: center; gap: .5rem;
    margin: 1.2rem 0 .6rem;
    padding: .4rem 1rem;
    border: 1px solid rgba(79,124,255,.4);
    border-radius: 999px;
    color: var(--accent2);
    font-size: .9rem;
    background: rgba(79,124,255,.08);
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent2);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .2; } }
  p.desc { color: var(--muted); line-height: 1.8; font-size: 1rem; }
  .progress {
    margin: 2rem auto 1rem;
    max-width: 360px;
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .progress .bar {
    height: 100%; width: 60%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    animation: load 2.4s ease-in-out infinite alternate;
  }
  @keyframes load { from { width: 35%; } to { width: 72%; } }
  .percent { color: var(--muted); font-size: .85rem; letter-spacing: .1em; }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .85rem; }
  .leader {
    margin-top: 1.6rem;
    color: var(--muted);
    font-size: .95rem;
  }
  .leader a { color: var(--accent2); text-decoration: none; }
  .leader a:hover { text-decoration: underline; }
  .actions { margin-top: 1.4rem; }
  .btn {
    display: inline-block;
    text-decoration: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    padding: .6rem 1.6rem;
    border-radius: 10px;
    font-size: .95rem;
    font-weight: 600;
    transition: opacity .2s, transform .2s;
  }
  .btn:hover { opacity: .85; transform: translateY(-2px); }
  .whip {
    margin-top: 2rem;
  }
  .whip-btn {
    display: inline-block;
    border: 1px solid rgba(79,124,255,.5);
    background: rgba(79,124,255,.08);
    color: var(--accent2);
    font-size: 1rem;
    font-weight: 600;
    padding: .8rem 1.8rem;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .1s, box-shadow .2s;
    user-select: none;
  }
  .whip-btn:hover { box-shadow: 0 4px 24px rgba(79,124,255,.35); }
  .whip-btn:active { transform: scale(.92); }
  .whip-btn:disabled { opacity: .6; cursor: not-allowed; }
  .whip-count {
    margin-top: .8rem;
    color: var(--muted);
    font-size: .95rem;
  }
  .whip-count strong { color: var(--accent2); font-size: 1.3rem; }
  .whip-tip { margin-top: .4rem; color: var(--muted); font-size: .8rem; }
  /* 登录区 */
  .auth-area {
    position: fixed; top: 1.2rem; right: 1.4rem; z-index: 10;
    display: flex; align-items: center; gap: .6rem;
  }
  .auth-btn {
    border: 1px solid rgba(79,124,255,.5);
    background: rgba(79,124,255,.08);
    color: var(--accent2);
    font-size: .85rem;
    padding: .45rem 1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: box-shadow .2s, opacity .2s;
  }
  .auth-btn:hover { box-shadow: 0 4px 20px rgba(79,124,255,.3); }
  .user-chip {
    display: flex; align-items: center; gap: .5rem;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;
    padding: .3rem .9rem .3rem .35rem;
    font-size: .85rem;
  }
  .user-chip img { width: 26px; height: 26px; border-radius: 50%; }
  .user-chip a { color: var(--text); text-decoration: none; }
  .user-chip .logout { color: var(--muted); cursor: pointer; font-size: .8rem; }
  .user-chip .logout:hover { color: var(--accent2); }
  /* 登录弹窗 */
  .modal-mask {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #141a30;
    border: 1px solid rgba(79,124,255,.35);
    border-radius: 16px;
    padding: 2rem;
    max-width: 380px; width: 90%;
    text-align: center;
  }
  .modal h3 { margin-bottom: 1rem; }
  .modal .code {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 1.5rem;
    letter-spacing: .2em;
    color: var(--accent2);
    background: rgba(79,124,255,.1);
    border-radius: 10px;
    padding: .8rem;
    margin-bottom: 1rem;
    user-select: all;
  }
  .modal p { color: var(--muted); font-size: .9rem; line-height: 1.7; }
  .modal a { color: var(--accent2); }
  .modal .close {
    margin-top: 1.2rem; cursor: pointer;
    color: var(--muted); font-size: .85rem;
    background: none; border: none;
  }
  .modal .close:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="auth-area">
    <button class="auth-btn" id="loginBtn" style="display:none;">🔑 使用 GitHub 登录</button>
    <div class="user-chip" id="userChip" style="display:none;">
      <img id="userAvatar" src="" alt="">
      <a id="userName" href="#" target="_blank" rel="noopener"></a>
      <span class="logout" id="logoutBtn">退出</span>
    </div>
  </div>
  <div class="modal-mask" id="deviceModal">
    <div class="modal">
      <h3>🔐 GitHub 设备登录</h3>
      <div class="code" id="userCode">---- ----</div>
      <p>1. 复制上方代码<br>2. 打开 <a href="https://github.com/login/device" target="_blank" rel="noopener">github.com/login/device</a><br>3. 粘贴代码并授权</p>
      <p id="modalStatus">等待授权中…</p>
      <button class="close" id="modalClose">取消</button>
    </div>
  </div>
  <main>
    <h1><span>BlueprintStudio</span> · 蓝图工作室</h1>
    <div class="badge"><span class="dot"></span>网站正在开发中</div>
    <p class="desc">我们正在精心绘制属于你的蓝图，<br>一个更好的站点即将上线，敬请期待。</p>
    <div class="progress"><div class="bar"></div></div>
    <div class="percent">CONSTRUCTING…</div>
    <p class="leader">工作室室长：小粽子（GitHub: <a href="https://github.com/xiaozongzi-0530" target="_blank" rel="noopener">xiaozongzi-0530</a>）</p>
    <div class="actions"><a class="btn" href="join.html">加入我们 →</a></div>
    <div class="whip">
      <button class="whip-btn" id="whipBtn">👊 鞭策开发者，催他干活！</button>
      <div class="whip-count">开发者已被鞭策 <strong id="whipCount">…</strong> 次</div>
      <div class="whip-tip">可以连点，但手速太快会被限流哦～</div>
    </div>
    <footer>© 2026 BlueprintStudio · 保留所有权利</footer>
  </main>
  <script>
    (function () {
      var NS = "blueprintstudio", KEY = "whip";
      var HIT = "https://abacus.jasoncameron.dev/hit/" + NS + "/" + KEY;
      var countEl = document.getElementById("whipCount");
      var btn = document.getElementById("whipBtn");
      var base = 0, localDelta = 0, queue = 0, sending = false;
      function render() { countEl.textContent = base + localDelta; }
      function fetchTotal() {
        fetch("https://abacus.jasoncameron.dev/get/" + NS + "/" + KEY)
          .then(function (r) { return r.text(); })
          .then(function (t) {
            var n = parseInt(t, 10);
            if (!isNaN(n)) { base = n; localDelta = 0; render(); }
          }).catch(function () {});
      }
      function flush() {
        if (sending || queue <= 0) return;
        sending = true;
        var batch = Math.min(queue, 5);
        queue -= batch;
        var chain = Promise.resolve();
        for (var i = 0; i < batch; i++) {
          chain = chain.then(function () {
            return fetch(HIT).catch(function () {});
          });
        }
        chain.then(function () {
          sending = false;
          if (queue > 0) setTimeout(flush, 1000);
        });
      }
      btn.addEventListener("click", function () {
        localDelta++;
        render();
        if (window.bsUserData) { window.bsUserData.whips = (window.bsUserData.whips || 0) + 1; if (window.bsSaveCloud) window.bsSaveCloud(); }
        btn.disabled = true;
        setTimeout(function () { btn.disabled = false; }, 700); /* 节流：最快0.7秒一次 */
        queue++;
        setTimeout(flush, 300);
      });
      fetchTotal();
      setInterval(fetchTotal, 30000); /* 每30秒同步一次全站总数 */
    })();
  </script>
  <script>
    /* ===== GitHub 登录（Device Flow，无需后端） ===== */
    var GH_CLIENT_ID = "Ov23liJ3DryZghydeNX2"; /* GitHub OAuth App Client ID */
    (function () {
      var TOKEN_KEY = "bs_gh_token";
      var loginBtn = document.getElementById("loginBtn");
      var chip = document.getElementById("userChip");
      var avatar = document.getElementById("userAvatar");
      var nameLink = document.getElementById("userName");
      var logoutBtn = document.getElementById("logoutBtn");
      var mask = document.getElementById("deviceModal");
      var codeEl = document.getElementById("userCode");
      var statusEl = document.getElementById("modalStatus");
      var pollTimer = null, ghToken = null, ghUser = null, cloudGistId = null;

      function showLogged(user) {
        ghUser = user;
        avatar.src = user.avatar_url;
        nameLink.textContent = user.login;
        nameLink.href = user.html_url;
        loginBtn.style.display = "none";
        chip.style.display = "flex";
      }
      function showLogin() { loginBtn.style.display = "inline-block"; chip.style.display = "none"; }
      function api(method, url, body) {
        return fetch(url, {
          method: method,
          headers: {
            "Authorization": "Bearer " + ghToken,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: body ? JSON.stringify(body) : undefined
        }).then(function (r) { return r.json(); });
      }
      /* 云端存储：用户数据存到自己的私密 Gist */
      function loadCloud() {
        api("GET", "https://api.github.com/user/gists").then(function (gists) {
          var mine = (gists || []).find(function (g) { return g.description === "BlueprintStudio 用户数据"; });
          if (mine) {
            cloudGistId = mine.id;
            var f = mine.files["profile.json"];
            if (f && f.raw_url) fetch(f.raw_url).then(function (r) { return r.json(); }).then(function (d) {
              window.bsUserData = d; document.dispatchEvent(new Event("bs-cloud"));
            });
          } else {
            api("POST", "https://api.github.com/gists", {
              description: "BlueprintStudio 用户数据",
              public: false,
              files: { "profile.json": { content: JSON.stringify({ user: ghUser.login, whips: 0, joined: new Date().toISOString() }) } }
            }).then(function (g) { if (g && g.id) { cloudGistId = g.id; window.bsUserData = JSON.parse(g.files["profile.json"].content); } });
          }
        }).catch(function () {});
      }
      function saveCloud() {
        if (!cloudGistId || !window.bsUserData) return;
        api("PATCH", "https://api.github.com/gists/" + cloudGistId, {
          files: { "profile.json": { content: JSON.stringify(window.bsUserData) } }
        });
      }
      window.bsSaveCloud = saveCloud;

      function poll(deviceCode, interval) {
        pollTimer = setInterval(function () {
          fetch("https://github.com/login/oauth/access_token", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ client_id: GH_CLIENT_ID, device_code: deviceCode, grant_type: "urn:ietf:params:oauth:grant-type:device_code" })
          }).then(function (r) { return r.json(); }).then(function (d) {
            if (d.access_token) {
              clearInterval(pollTimer);
              mask.classList.remove("show");
              localStorage.setItem(TOKEN_KEY, d.access_token);
              ghToken = d.access_token;
              fetch("https://api.github.com/user", { headers: { "Authorization": "Bearer " + ghToken, "Accept": "application/vnd.github+json" } })
                .then(function (r) { return r.json(); })
                .then(function (u) { showLogged(u); loadCloud(); });
            } else if (d.error === "authorization_pending") {
              /* 继续等待 */
            } else if (d.error === "slow_down") {
              clearInterval(pollTimer); poll(deviceCode, interval + 5000);
            } else {
              clearInterval(pollTimer);
              statusEl.textContent = "登录失败：" + (d.error_description || d.error);
            }
          }).catch(function () {});
        }, interval || 5000);
      }
      loginBtn.addEventListener("click", function () {
        if (!GH_CLIENT_ID) { alert("站长还没配置 GitHub OAuth App 的 Client ID。"); return; }
        statusEl.textContent = "等待授权中…";
        mask.classList.add("show");
        fetch("https://github.com/login/device/code", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ client_id: GH_CLIENT_ID, scope: "gist" })
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d.user_code) {
            codeEl.textContent = d.user_code;
            poll(d.device_code, d.interval ? d.interval * 1000 : 5000);
          } else {
            statusEl.textContent = "获取设备码失败：" + (d.error_description || "未知错误");
          }
        }).catch(function () { statusEl.textContent = "网络错误，请稍后再试"; });
      });
      document.getElementById("modalClose").addEventListener("click", function () {
        mask.classList.remove("show");
        if (pollTimer) clearInterval(pollTimer);
      });
      logoutBtn.addEventListener("click", function () {
        localStorage.removeItem(TOKEN_KEY);
        ghToken = null; ghUser = null; cloudGistId = null; window.bsUserData = null;
        showLogin();
      });
      (function init() {
        var t = localStorage.getItem(TOKEN_KEY);
        if (t) {
          ghToken = t;
          fetch("https://api.github.com/user", { headers: { "Authorization": "Bearer " + ghToken, "Accept": "application/vnd.github+json" } })
            .then(function (r) { if (!r.ok) throw 0; return r.json(); })
            .then(function (u) { showLogged(u); loadCloud(); })
            .catch(function () { localStorage.removeItem(TOKEN_KEY); showLogin(); });
        } else showLogin();
      })();
    })();
  </script>
</body>
</html>
