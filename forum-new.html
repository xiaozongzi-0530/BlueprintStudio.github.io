<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发帖 · BlueprintStudio</title>
<script src="logger.js"></script>
<style>
  :root { --bg:#0b1020; --accent:#4f7cff; --accent2:#22d3ee; --text:#e6ebf5; --muted:#8a93a8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; }
  .grid-bg {
  pointer-events: none;
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(rgba(79,124,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,124,255,.07) 1px, transparent 1px);
    background-size:40px 40px;
  }
  header {
    position:sticky; top:0; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:1rem 2rem;
    background:rgba(11,16,32,.85); backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(79,124,255,.15);
  }
  .brand { font-weight:700; letter-spacing:.05em; font-size:1.1rem; text-decoration:none; color:var(--text); }
  .brand span { color:var(--accent2); }
  nav a { color:var(--muted); text-decoration:none; margin-left:1.5rem; font-size:.95rem; }
  nav a:hover, nav a.active { color:var(--accent2); }
  main { position:relative; z-index:1; max-width:800px; margin:0 auto; padding:2.5rem 1.5rem; }
  h1 { font-size:1.7rem; margin-bottom:.4rem; }
  h1 em {
    font-style:normal;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub { color:var(--muted); font-size:.92rem; margin-bottom:1.8rem; }
  .card {
    background:rgba(255,255,255,.04);
    border:1px solid rgba(79,124,255,.25);
    border-radius:16px; padding:1.5rem; margin-bottom:1.2rem;
  }
  textarea, input[type="text"] {
    width:100%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(79,124,255,.3);
    border-radius:10px; color:var(--text);
    padding:.7rem .9rem; font-size:.95rem;
    outline:none; font-family:inherit;
  }
  textarea { min-height:90px; resize:vertical; margin-bottom:.8rem; }
  textarea:focus, input:focus { border-color:var(--accent2); }
  .btn {
    display:inline-block; text-decoration:none; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff; padding:.6rem 1.5rem; border-radius:10px;
    font-size:.92rem; font-weight:600;
  }
  .btn.ghost { background:transparent; border:1px solid rgba(79,124,255,.5); color:var(--accent2); }
  .file-label .fclip {
    display:inline-block; width:12px; height:12px; margin-right:.35rem;
    border:2px solid currentColor; border-radius:3px 3px 3px 0;
    border-top-color:transparent; border-right-color:transparent;
    transform:rotate(-45deg) translateY(-1px);
  }
  .file-label {
    display:inline-block; cursor:pointer;
    border:1px dashed rgba(79,124,255,.5); color:var(--accent2);
    padding:.45rem 1rem; border-radius:10px; font-size:.85rem; margin-right:.8rem;
  }
  input[type="file"] { display:none; }
  .file-hint { color:var(--muted); font-size:.8rem; margin-top:.5rem; }
  .post-head { display:flex; align-items:center; gap:.6rem; margin-bottom:.7rem; flex-wrap:wrap; }
  .post-head .nick { font-weight:700; }
  .badge-title, .badge-admin {
    background:#f5b301; color:#1a1a1a;
    font-size:.68rem; font-weight:700;
    padding:.15rem .5rem; border-radius:999px;
  }
  .badge-guest {
    background:rgba(139,147,168,.85); color:#0b1020;
    font-size:.68rem; font-weight:700;
    padding:.15rem .5rem; border-radius:999px;
  }
  .post-head .time { color:var(--muted); font-size:.8rem; margin-left:auto; }
  .post-body { color:var(--text); font-size:.95rem; line-height:1.9; white-space:pre-wrap; word-break:break-word; }
  .post-files { margin-top:.8rem; display:flex; flex-wrap:wrap; gap:.6rem; }
  .post-files a {
    color:var(--accent2); text-decoration:none; font-size:.85rem;
    border:1px solid rgba(79,124,255,.4);
    padding:.35rem .8rem; border-radius:8px;
  }
  .post-foot { margin-top:.8rem; display:flex; gap:1.2rem; align-items:center; }
  .post-foot a { color:var(--muted); font-size:.8rem; text-decoration:none; cursor:pointer; }
  .post-foot a:hover { color:#ff6b6b; }
  .report-badge { color:#ff6b6b; font-size:.8rem; }
  .del-btn { color:#ff6b6b; }
  .cmt-area { margin-top:.8rem; border-top:1px solid rgba(255,255,255,.1); padding-top:.8rem; display:none; }
  .cmt-area.open { display:block; }
  .cmt { font-size:.88rem; line-height:1.8; padding:.4rem 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .cmt .who { color:var(--accent2); font-weight:600; }
  .cmt .t { color:var(--muted); font-size:.75rem; margin-left:.5rem; }
  .cmt-row { display:flex; gap:.6rem; margin-top:.7rem; }
  .cmt-row input { flex:1; }
  .cmt-send { border:none; cursor:pointer; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; padding:.5rem 1.1rem; border-radius:10px; font-size:.85rem; }
  .empty { color:var(--muted); text-align:center; padding:2rem; }
  .tip { color:var(--muted); font-size:.85rem; margin-bottom:1.5rem; line-height:1.8; }
  .tip a { color:var(--accent2); }
  footer { position:relative; z-index:1; text-align:center; padding:2rem; color:var(--muted); font-size:.85rem; border-top:1px solid rgba(79,124,255,.12); }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <header>
    <a class="brand" href="index.html">Blueprint<span>Studio</span></a>
    <nav>
      <a href="index.html">首页</a>
      <a href="forum.html">论坛</a>
      <a href="forum-new.html" class="active">发帖</a>
      <a href="chat.html">聊天</a>
      <a href="notes.html">笔记</a>
      <a href="discover.html">发现</a>
      <a href="ann.html">公告</a>
      <a href="join.html">联系我们</a>
    </nav>
  </header>
  <main>
    <h1>发布<em>帖子</em></h1>
    <p class="sub">分享作品、交流想法、发布文件。发布后会回到论坛列表。</p>

    <div class="tip" id="loginTip">
      ⚠️ 发帖前请先 <a href="index.html">登录 / 注册</a>，或在首页用「游客模式」进入。
    </div>

    <div class="card" id="postBox" style="display:none;">
      <textarea id="postText" placeholder="说点什么…（文明发言，禁止违规内容）" style="min-height:200px;"></textarea>
      <div style="display:flex; align-items:center; flex-wrap:wrap; gap:.6rem;">
        <label class="file-label"><span class="fclip"></span>添加文件<input type="file" id="postFiles" multiple></label>
        <a class="btn ghost" href="forum.html" style="text-decoration:none; margin-left:auto;">返回列表</a>
        <button class="btn" id="sendBtn">发布</button>
      </div>
      <div class="file-hint">支持多个文件，单个文件最大 300KB（小图片、文档、代码等）</div>
      <div class="file-hint" id="fileList"></div>
    </div>
  </main>
  <footer>© 2026 BlueprintStudio · 非商业性质工作室 · 保留所有权利</footer>

  <script src="ratelimit.js"></script>
  <script>
    (function () {
      var DB = "https://textdb.dev/api/data/blueprintstudio-forum-2026";
      var KEY = "bs_auth";
      var ADMIN_EMAIL = "zhouxinyuan0530@qq.com";
      var MAX_FILE = 300 * 1024; /* 单文件300KB */
      var me = null, myInfo = null, filesData = [];
      /* 游客模式：gs_mode=1 且 gs_uid 为 10 位数字 */
      var gUID = localStorage.getItem("gs_uid") || "";
      var isGuest = localStorage.getItem("gs_mode") === "1" && /^\d{10}$/.test(gUID);

      try { myInfo = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
      if (myInfo && myInfo.email) {
        me = myInfo.email;
        document.getElementById("loginTip").style.display = "none";
        document.getElementById("postBox").style.display = "block";
      } else if (isGuest) {
        /* 游客：以 guest:<uid> 作为作者标识，和注册邮箱不冲突 */
        me = "guest:" + gUID;
        document.getElementById("loginTip").style.display = "none";
        document.getElementById("postBox").style.display = "block";
      }

      function getDB() {
        return fetch(DB + "?t=" + Date.now()).then(function (r) { return r.json(); })
          .catch(function () { return { posts: [] }; });
      }
      function saveDB(db) {
        return fetch(DB, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(db) });
      }
      function esc(t) {
        return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function fmtTime(iso) {
        try { return new Date(iso).toLocaleString("zh-CN", { hour12: false }); } catch (e) { return iso; }
      }

      /* ===== 文件选择 ===== */
      document.getElementById("postFiles").addEventListener("change", function (e) {
        var fs = Array.prototype.slice.call(e.target.files);
        filesData = [];
        var pending = fs.length, done = 0;
        if (!fs.length) { document.getElementById("fileList").textContent = ""; return; }
        fs.forEach(function (f) {
          if (f.size > MAX_FILE) {
            document.getElementById("fileList").textContent = "「" + f.name + "」超过 300KB，已被忽略";
            done++;
            return;
          }
          var r = new FileReader();
          r.onload = function () {
            filesData.push({ name: f.name, type: f.type || "application/octet-stream", data: r.result });
            done++;
            if (done === pending) {
              document.getElementById("fileList").textContent =
                "已添加 " + filesData.length + " 个文件：" + filesData.map(function (x) { return x.name; }).join("、");
            }
          };
          r.readAsDataURL(f);
        });
      });

      /* ===== 发布 ===== */
      document.getElementById("sendBtn").addEventListener("click", function () {
        var text = document.getElementById("postText").value.trim();
        if (!text && !filesData.length) { alert("内容不能为空"); return; }
        /* 防刷：游客 10 分钟最多 5 帖，注册用户 1 分钟 5 帖；两次至少间隔 5 秒 */
        var rl = isGuest
          ? RLT.hit("forum:guest", 10 * 60 * 1000, 5, 5000)
          : RLT.hit("forum:user", 60 * 1000, 5, 3000);
        if (!rl.ok) { alert(rl.msg); return; }
        /* 相同内容 1 分钟内不允许重复发（防刷屏） */
        var sc = RLT.sameContent("forum", text, 60000);
        if (!sc.ok) { alert(sc.msg); return; }
        var btn = this;
        btn.disabled = true; btn.textContent = "发布中…";
        getDB().then(function (db) {
          db.posts = db.posts || [];
          db.posts.unshift({
            id: Date.now() + "_" + Math.random().toString(36).slice(2, 8),
            author: me,
            guest: isGuest,
            nick: localStorage.getItem("bs_nick") || (isGuest ? "游客" : myInfo.email.split("@")[0]),
            uid: localStorage.getItem("bs_uid") || "",
            title: isGuest ? "" : (localStorage.getItem("bs_title") || ""),
            content: text.slice(0, 5000),
            files: filesData,
            time: new Date().toISOString(),
            reports: []
          });
          return saveDB(db).then(function () {
            document.getElementById("postText").value = "";
            filesData = [];
            document.getElementById("postFiles").value = "";
            document.getElementById("fileList").textContent = "";
            btn.disabled = false; btn.textContent = "发布";
            /* 发帖页只负责写，发布后回到论坛列表 */
            location.href = "forum.html?new=" + encodeURIComponent(db.posts[0].id);
          });
        }).catch(function () { alert("发布失败，请稍后再试"); btn.disabled = false; btn.textContent = "发布"; });
      });

      /* 登录用户昵称/头衔从云端刷新，用于帖子署名（游客不查云端，直接用本地值） */
      if (me && !isGuest) {
        fetch("https://textdb.dev/api/data/blueprintstudio-users-2026?t=" + Date.now())
          .then(function (r) { return r.json(); })
          .then(function (db) {
            var u = db.users && db.users[me];
            if (u) {
              localStorage.setItem("bs_nick", u.nick || "");
              localStorage.setItem("bs_uid", u.uid || "");
              localStorage.setItem("bs_title", u.title || "");
              if (u.banned) { location.href = "ban.html?email=" + encodeURIComponent(me); return; }
            }
          }).catch(function () {});
      }
    })();
  </script>
</body>
</html>
